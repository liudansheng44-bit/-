<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>截骨大师（原型）</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="app-header">
      <h1>截骨大师</h1>
      <p>骨科术前测量与方案草拟工具（教学/演示原型）</p>
    </header>

    <main class="layout">
      <section class="card">
        <h2>1) 基础参数</h2>
        <div class="grid">
          <label>当前机械轴角 HKA（°）
            <input id="currentHka" type="number" step="0.1" value="174" />
          </label>
          <label>目标机械轴角 HKA（°）
            <input id="targetHka" type="number" step="0.1" value="180" />
          </label>
          <label>截骨中心至外侧皮质距离（mm）
            <input id="hingeDistance" type="number" step="0.1" value="60" />
          </label>
          <label>截骨面长度（mm，可选）
            <input id="cutLength" type="number" step="0.1" placeholder="例如 80" />
          </label>
        </div>
        <button id="calculateBtn">计算方案</button>
      </section>

      <section class="card">
        <h2>2) 结果</h2>
        <div id="result" class="result muted">输入参数后点击“计算方案”。</div>
      </section>

      <section class="card">
        <h2>3) 简易随访记录</h2>
        <form id="noteForm" class="grid">
          <label>患者代号
            <input id="patientId" required placeholder="如 P-001" />
          </label>
          <label>备注
            <input id="noteText" required placeholder="如 术后第14天，切口良好" />
          </label>
          <button type="submit">添加记录</button>
        </form>
        <ul id="notesList"></ul>
      </section>
    </main>

    <footer class="app-footer">
      <small>⚠️ 本应用仅用于学习和流程演示，不可替代临床决策。</small>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
